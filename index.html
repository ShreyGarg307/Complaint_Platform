<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Centralized platform for students to raise and track complaints">
    <title>Complaint Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="login-screen" class="login-screen">
        <div class="login-card glassmorphism">
            <div class="login-header">
                <h2>Welcome to ResolveHub</h2>
                <p>Please log in to continue</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-role">Select Role</label>
                    <select id="login-role" required>
                        <option value="Student">Student</option>
                        <option value="Admin">Administration</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="login-username">Demo Username</label>
                    <input type="text" id="login-username" value="student_1" readonly>
                </div>
                <button type="submit" class="primary-btn">Log In</button>
            </form>
        </div>
    </div>

    <div id="app" style="display: none;">
        <aside class="sidebar glassmorphism" id="sidebar">
            <div class="sidebar-top">
                <!-- Home logo link -->
                <a href="index.html" class="logo" id="brand-logo" title="Go to Home">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="url(#paint0_linear)"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <defs>
                            <linearGradient id="paint0_linear" x1="2" y1="2" x2="22" y2="22"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#3b82f6" />
                                <stop offset="1" stop-color="#8b5cf6" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <span>ResolveHub</span>
                </a>

                <!-- Collapse toggle -->
                <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle sidebar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>

                <nav class="sidebar-nav">
                    <button id="nav-student" class="nav-btn active" data-tooltip="Student Portal">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <span>Student Portal</span>
                    </button>
                    <button id="nav-department" class="nav-btn" data-tooltip="Department Dashboard">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7" />
                            <rect x="14" y="3" width="7" height="7" />
                            <rect x="14" y="14" width="7" height="7" />
                            <rect x="3" y="14" width="7" height="7" />
                        </svg>
                        <span>Department Dashboard</span>
                    </button>
                    <button id="nav-analytics" class="nav-btn" data-tooltip="Analytics">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10" />
                            <line x1="12" y1="20" x2="12" y2="4" />
                            <line x1="6" y1="20" x2="6" y2="14" />
                        </svg>
                        <span>Analytics</span>
                    </button>
                    <button id="nav-feed" class="nav-btn" data-tooltip="Public Feed">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                        </svg>
                        <span>Public Feed</span>
                    </button>
                </nav>
            </div>
            <div class="sidebar-bottom">
                <button id="nav-notifications" class="nav-btn notif-btn" data-tooltip="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span>Notifications</span>
                    <span id="notif-badge" class="badge">0</span>
                </button>
                <button id="nav-logout" class="nav-btn" data-tooltip="Logout" style="color: var(--danger); margin-top: 0.5rem; border-top: 1px solid var(--border); border-radius: 0; padding-top: 0.85rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <main id="main-content">
            <!-- Dynamic Content Renders Here -->
        </main>
    </div>

    <!-- Templates -->
    <template id="tpl-notifications">
        <div class="notif-page-container">
            <div class="notif-page-header glassmorphism">
                <div class="notif-page-title">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <h2>Notifications</h2>
                </div>
                <div class="notif-page-actions" style="display:flex; gap:0.5rem">
                    <button id="mark-all-read" class="mark-read-btn">Mark all as read</button>
                    <button id="clear-all-notifs" class="mark-read-btn clear-btn">Clear all</button>
                </div>
            </div>
            <div id="notif-page-list" class="notif-page-list"></div>
        </div>
    </template>

    <template id="tpl-student-portal">
        <div class="portal-container portal-list-only">
            <section class="list-section glassmorphism">
                <div class="list-section-header">
                    <h2>My Complaints</h2>
                    <p style="color:var(--text-muted);font-size:0.9rem">Use the <strong style="color:var(--primary)">+</strong> button to raise a new complaint.</p>
                </div>
                <div id="student-complaints-list" class="complaints-list">
                    <!-- Complaints will render here -->
                </div>
            </section>
        </div>
    </template>

    <template id="tpl-department-dashboard">
        <div class="dashboard-container">
            <div class="dashboard-header glassmorphism">
                <h2>Department Dashboard</h2>
                <select id="dept-filter">
                    <option value="All">All Departments</option>
                    <option value="IT Support">IT Support</option>
                    <option value="Facility Management">Facility Management</option>
                    <option value="Janitorial Services">Janitorial Services</option>
                    <option value="Academic Affairs">Academic Affairs</option>
                    <option value="Administration">Administration</option>
                </select>
            </div>
            <div class="dashboard-tabs glassmorphism">
                <button class="tab-btn active" data-target="Pending">Pending</button>
                <button class="tab-btn" data-target="In Progress">In Progress</button>
                <button class="tab-btn" data-target="Resolved">Resolved</button>
            </div>
            <div class="kanban-board tabbed-view">
                <div class="kanban-column glassmorphism active" data-status="Pending">
                    <div class="kanban-items" id="board-pending"></div>
                </div>
                <div class="kanban-column glassmorphism" data-status="In Progress">
                    <div class="kanban-items" id="board-in-progress"></div>
                </div>
                <div class="kanban-column glassmorphism" data-status="Resolved">
                    <div class="kanban-items" id="board-resolved"></div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-analytics">
        <div class="analytics-container">
            <div class="dashboard-header glassmorphism">
                <h2>Platform Analytics</h2>
            </div>
            <div class="dashboard-tabs glassmorphism" id="analytics-tabs" style="margin-top:1rem; flex-wrap: wrap; justify-content: flex-start; gap: 0.5rem; padding: 0.5rem;">
                <button class="tab-btn active" data-target="All">All Departments</button>
                <button class="tab-btn" data-target="IT Support">IT Support</button>
                <button class="tab-btn" data-target="Facility Management">Facility Management</button>
                <button class="tab-btn" data-target="Janitorial Services">Janitorial Services</button>
                <button class="tab-btn" data-target="Academic Affairs">Academic Affairs</button>
                <button class="tab-btn" data-target="Administration">Administration</button>
            </div>
            <div class="stats-grid" style="margin-top:1.5rem">
                <div class="stat-card glassmorphism stat-card-clickable" id="stat-card-total" data-filter="all" title="Click to view complaints">
                    <h3 id="stat-total">0</h3>
                    <p>Total Complaints</p>
                    <span class="stat-card-hint">click to view</span>
                </div>
                <div class="stat-card glassmorphism stat-card-clickable" id="stat-card-resolved" data-filter="Resolved" title="Click to view complaints">
                    <h3 id="stat-resolved">0</h3>
                    <p>Resolved</p>
                    <span class="stat-card-hint">click to view</span>
                </div>
                <div class="stat-card glassmorphism stat-card-clickable" id="stat-card-pending" data-filter="Pending" title="Click to view complaints">
                    <h3 id="stat-pending">0</h3>
                    <p>Pending</p>
                    <span class="stat-card-hint">click to view</span>
                </div>
            </div>
            <div id="analytics-complaint-list" class="analytics-complaint-list" style="display:none;"></div>
            <div class="charts-section glassmorphism" style="margin-top:1.5rem; padding:2rem" id="analytics-chart-container">
                <h3>Department Workload</h3>
                <div id="chart-bars" class="chart-bars"></div>
            </div>
        </div>
    </template>

    <template id="tpl-public-feed">
        <div class="feed-container">
            <div class="feed-header glassmorphism">
                <h2>Public Transparency Feed</h2>
                <p style="color:var(--text-muted); margin-top:0.5rem">Live anonymized log of reported issues across the
                    campus.</p>
            </div>
            <div id="public-feed-list" class="complaints-list" style="margin-top:1.5rem"></div>
        </div>
    </template>

    <template id="tpl-complaint-card">
        <div class="complaint-card">
            <img class="card-image" src="" alt="Complaint attachment" style="display:none;">
            <div class="card-body">
                <div class="card-header">
                    <div>
                        <span class="category-badge"></span>
                        <span class="escalated-badge" style="display:none;">Escalated</span>
                    </div>
                    <span class="status-badge"></span>
                </div>
                <p class="description"></p>
                <div class="card-footer">
                    <span class="ticket-id"></span>
                    <span class="date"></span>
                </div>
                <div class="action-bar" style="display: none;">
                    <select class="status-update">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
                <div class="escalate-bar"
                    style="display: none; margin-top: 1rem; border-top: 1px dashed var(--border); padding-top: 1rem;">
                    <button class="escalate-btn">Escalate to Admin</button>
                </div>
            </div>
        </div>
    </template>

    <div id="toast-container" class="toast-container"></div>

    <!-- Floating Action Button -->
    <button id="fab-btn" class="fab-btn" title="Raise a Complaint" aria-label="Raise a Complaint">
        <svg id="fab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
    </button>

    <!-- FAB Modal Overlay -->
    <div id="fab-overlay" class="fab-overlay" aria-hidden="true">
        <div class="fab-modal glassmorphism" role="dialog" aria-modal="true" aria-labelledby="fab-modal-title">
            <div class="fab-modal-header">
                <h3 id="fab-modal-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    Raise a Complaint
                </h3>
                <button id="fab-close" class="fab-close" aria-label="Close">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="fab-complaint-form" class="fab-form">
                <div class="form-group">
                    <label for="fab-category">Category</label>
                    <select id="fab-category" required>
                        <option value="">Select a category</option>
                        <option value="IT">IT &amp; WiFi (Hardware/Software)</option>
                        <option value="Maintenance">Maintenance (Plumbing/Electrical)</option>
                        <option value="Cleaning">Cleaning (Janitorial/Dustbin/Washrooms)</option>
                        <option value="Academic">Academic (Grades/Syllabus)</option>
                        <option value="Admin">Admin (Fees/Documents)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fab-description">Description</label>
                    <textarea id="fab-description" rows="4" placeholder="Describe your issue in detail..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="fab-image">Attachment <span style="color:var(--text-muted);font-weight:400">(Optional)</span></label>
                    <input type="file" id="fab-image" accept="image/*">
                </div>
                <button type="submit" class="primary-btn">Submit Complaint</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
